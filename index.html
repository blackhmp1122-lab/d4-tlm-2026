<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Loading - Petir Bergerak</title>
    
    <style>
        /* =========================================
           1. VARIABEL CSS (Mudah diubah)
           ========================================= */
        :root {
            --bg-dark-center: #2a2d45;
            --bg-dark-edge: #151623;
            --text-main: #e0e0e0;
            --text-sub: #a0a3b8;
            --bar-bg: #4a4c63;
            --bar-fill: #00d2ff;
            --bar-glow: rgba(0, 210, 255, 0.6);
            --bolt-yellow: #ffea00;
            --bolt-orange: #ff8c00;
            --icon-bg: #1b1d2b;
        }

        /* =========================================
           2. RESET & PENGATURAN DASAR
           ========================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Latar belakang gradasi radial untuk efek fokus ke tengah */
            background: radial-gradient(circle at center, var(--bg-dark-center) 0%, var(--bg-dark-edge) 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            overflow: hidden;
            position: relative;
        }

        /* =========================================
           3. BAGIAN HEADER (Teks Welcome)
           ========================================= */
        header {
            width: 100%;
            text-align: center;
            margin-bottom: 60px;
            z-index: 10;
        }

        .welcome-text {
            font-size: 2.8rem;
            font-weight: 300;
            color: var(--text-main);
            letter-spacing: 4px;
            text-transform: uppercase;
            /* Efek bayangan teks agar lebih elegan */
            text-shadow: 0px 4px 15px rgba(255, 255, 255, 0.1);
            /* TIDAK ADA ANIMASI TEKS BERJALAN DI SINI */
        }

        /* =========================================
           4. BAGIAN MAIN (Area Loading)
           ========================================= */
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            z-index: 10;
        }

        .loading-wrapper {
            width: 100%;
            max-width: 500px; /* Lebar maksimal bar */
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Area tempat bar dan ikon berada */
        .progress-area {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            height: 80px; /* Memberi ruang untuk ikon */
        }

        /* Garis latar belakang (track) */
        .progress-track {
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            width: 100%;
            height: 6px; /* Sedikit lebih tebal agar terlihat jelas */
            background-color: var(--bar-bg);
            border-radius: 3px;
            z-index: 1;
            overflow: hidden; /* Agar isi bar tidak keluar dari jalur */
        }

        /* Isi progress bar (warna cyan) */
        .progress-fill {
            height: 100%;
            background-color: var(--bar-fill);
            width: 53%; /* Sesuai gambar referensi awal */
            border-radius: 3px;
            box-shadow: 0 0 10px var(--bar-glow);
            transition: width 0.2s linear; /* Transisi halus jika JS dijalankan */
        }

        /* =========================================
           5. IKON PETIR (DENGAN ANIMASI)
           ========================================= */
        .lightning-container {
            position: relative;
            z-index: 2; /* Berada di atas garis progress bar */
            width: 70px;
            height: 70px;
            background-color: var(--icon-bg);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Animasi cahaya berdenyut pada wadah */
            animation: pulseGlow 1.5s infinite alternate;
            border: 2px solid rgba(255, 255, 255, 0.05);
        }

        /* Bentuk dasar petir menggunakan Clip-Path */
        .lightning-bolt {
            width: 30px;
            height: 45px;
            background: linear-gradient(180deg, var(--bolt-yellow) 0%, var(--bolt-orange) 100%);
            /* Polygon untuk membentuk zig-zag petir */
            clip-path: polygon(
                55% 0%, 
                100% 0%, 
                65% 40%, 
                95% 40%, 
                45% 100%, 
                55% 55%, 
                15% 55%
            );
            /* Animasi sambaran petir */
            animation: strike 1.5s infinite;
            filter: drop-shadow(0 0 8px var(--bolt-yellow));
        }

        /* Partikel kecil di sekitar petir (Opsional) */
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background-color: var(--bolt-yellow);
            border-radius: 50%;
            opacity: 0;
        }

        .particle:nth-child(1) {
            top: 10px;
            left: 15px;
            animation: sparkFly 1.5s infinite 0.2s;
        }

        .particle:nth-child(2) {
            bottom: 15px;
            right: 15px;
            animation: sparkFly 1.5s infinite 0.7s;
        }

        .particle:nth-child(3) {
            top: 20px;
            right: 10px;
            animation: sparkFly 1.5s infinite 1.1s;
        }

        /* =========================================
           6. BAGIAN FOOTER (Teks Bawah)
           ========================================= */
        footer {
            width: 100%;
            max-width: 500px;
            margin-top: 15px;
            z-index: 10;
        }

        .text-area {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 1rem;
            color: var(--text-sub);
            padding: 0 5px;
            letter-spacing: 1px;
        }

        .percentage {
            font-weight: bold;
            color: #ffffff;
            font-family: monospace; /* Agar angka stabil lebarnya */
        }

        /* =========================================
           7. DEFINISI ANIMASI (KEYFRAMES)
           ========================================= */
        
        /* Animasi cahaya berdenyut di belakang petir */
        @keyframes pulseGlow {
            0% { 
                box-shadow: 0 0 10px rgba(255, 234, 0, 0.1), 
                            0 0 20px rgba(255, 140, 0, 0.1); 
            }
            100% { 
                box-shadow: 0 0 20px rgba(255, 234, 0, 0.6), 
                            0 0 40px rgba(255, 140, 0, 0.3); 
            }
        }

        /* Animasi sambaran petir (berkedip dan membesar sedikit) */
        @keyframes strike {
            0%, 100% { 
                opacity: 1; 
                filter: brightness(1);
                transform: scale(1);
            }
            10% { 
                opacity: 0.7; 
                filter: brightness(1.5); 
                transform: scale(0.95); /* Sedikit mengecil sebelum menyambar */
            }
            15% { 
                opacity: 1; 
                filter: brightness(2.5); /* Kilatan sangat terang */
                transform: scale(1.1); /* Membesar saat menyambar */
            }
            20% { 
                opacity: 0.9; 
                filter: brightness(1.2);
                transform: scale(1);
            }
            50% { 
                opacity: 1; 
                filter: brightness(1); 
            }
        }

        /* Animasi partikel terbang (efek tambahan) */
        @keyframes sparkFly {
            0% {
                opacity: 0;
                transform: translate(0, 0) scale(0.5);
            }
            20% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translate(15px, -25px) scale(1.5);
            }
        }
    </style>
</head>
<body>

    <!-- BAGIAN ATAS: Teks Welcome -->
    <header>
        <h1 class="welcome-text">Welcome</h1>
    </header>

    <!-- BAGIAN TENGAH: Progress Bar dan Ikon -->
    <main>
        <div class="loading-wrapper">
            
            <div class="progress-area">
                <!-- Garis Latar Progress -->
                <div class="progress-track">
                    <!-- Isi Progress Berjalan -->
                    <div class="progress-fill" id="progressBar"></div>
                </div>
                
                <!-- Ikon Petir dengan Animasi -->
                <div class="lightning-container">
                    <!-- Partikel Tambahan -->
                    <div class="particle"></div>
                    <div class="particle"></div>
                    <div class="particle"></div>
                    <!-- Bentuk Petir Utama -->
                    <div class="lightning-bolt"></div>
                </div>
            </div>

        </div>
    </main>

    <!-- BAGIAN BAWAH: Teks Loading & Persentase -->
    <footer>
        <div class="text-area">
            <span class="loading-label">Loading</span>
            <span class="percentage" id="percentageText">53%</span>
        </div>
    </footer>

    <!-- SCRIPT JAVASCRIPT -->
    <script>
        /* =========================================

        let currentProgress = 53;

        const progressBarElement = document.getElementById('progressBar');
        const percentageTextElement = document.getElementById('percentageText');

</body>
</html>
